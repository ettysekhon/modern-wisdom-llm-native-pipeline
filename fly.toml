# Fly.io configuration for Modern Wisdom RAG Pipeline
# See https://fly.io/docs/reference/configuration/
#
# Prerequisites:
# 1. Deploy Qdrant: fly deploy --config fly.qdrant.toml
# 2. Deploy Phoenix (optional): fly deploy --config fly.phoenix.toml
# 3. Set secrets: fly secrets set OPENAI_API_KEY=sk-...

app = "modern-wisdom-rag"
primary_region = "lhr"

# Build configuration
[build]
  dockerfile = "Dockerfile"

[env]
  # Use Fly Flycast networking: http://<app-name>.flycast:<port>
  QDRANT_URL = "http://modern-wisdom-qdrant.flycast:6333"
  INDEX_VERSION = "mw_chunks_live"
  
  # Application paths
  MW_DATA_DIR = "/app/data"
  
  # LLM configuration
  MW_LLM_PROVIDER = "openai"
  MW_LLM_MODEL = "gpt-4o-mini"
  MW_SCOPE = "corpus"
  MW_TOP_K = "8"
  
  # Chainlit configuration
  CHAINLIT_TELEMETRY = "False"
  CHAINLIT_HOST = "0.0.0.0"
  CHAINLIT_PORT = "8001"
  
  # Phoenix OTEL configuration (disabled - Flycast connection issues)
  # PHOENIX_COLLECTOR_ENDPOINT = "http://modern-wisdom-phoenix.flycast:6006/v1/traces"
  # OTEL_EXPORTER_OTLP_ENDPOINT = "http://modern-wisdom-phoenix.flycast:6006/v1/traces"
  # PHOENIX_PROJECT_NAME = "mw-rag"
  # Note: Re-enable when Flycast issue is resolved, or use public URL:
  # PHOENIX_COLLECTOR_ENDPOINT = "https://modern-wisdom-phoenix.fly.dev/v1/traces"


# HTTP service configuration
[[services]]
  internal_port = 8001
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  # HTTP ports
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Connection concurrency
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  # Health checks
  # Note: TCP checks removed - using HTTP checks only for Chainlit
  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "90s"  # Increased for Chainlit startup time (app takes ~20-30s to start)
    method = "GET"
    path = "/"
    protocol = "http"
    # Chainlit doesn't have a dedicated health endpoint, so we check the main page
    [services.http_checks.headers]
      User-Agent = "Fly-Health-Check"

# VM resources
[vm]
  memory_mb = 1024
  cpu_kind = "shared"
  cpus = 1

# Deployment strategy
[deploy]
  strategy = "rolling"
  max_unavailable = 1

# Optional: HTTP service configuration (alternative to [[services]])
# Uncomment if you prefer the simpler http_service syntax
# [http_service]
#   internal_port = 8001
#   force_https = true
#   auto_stop_machines = true
#   auto_start_machines = true
#   min_machines_running = 0
#   processes = ["app"]
#   
#   [http_service.concurrency]
#     type = "connections"
#     hard_limit = 25
#     soft_limit = 20

# Metrics (optional)
[metrics]
  port = 8001
  path = "/metrics"