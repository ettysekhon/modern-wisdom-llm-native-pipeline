[project]
name = "modern-wisdom-rag-pipeline"
version = "0.1.0"
description = "Modern Wisdom Rag Pipeline"
requires-python = ">=3.13"
dependencies = [
    "assemblyai>=0.43.1",
    "duckdb==1.4.0",
    "faster-whisper>=1.2.0",
    "ipython>=9.5.0",
    "jupyter>=1.1.1",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "pyarrow>=21.0.0",
    "fastembed>=0.7.3",
    "chainlit>=2.8.3",
    "qdrant-client>=1.15.1",
    "jsonschema>=4.25.1",
    "rich>=14.1.0",
    "httpx>=0.28.1",
    "rank-bm25>=0.2.2",
    "arize-phoenix>=12.6.0",
    "openai>=2.0.0",
    "opentelemetry-api>=1.37.0",
    "opentelemetry-sdk>=1.37.0",
]

[project.optional-dependencies]
dev = [
  "uvicorn>=0.30.0 ; extra == 'dev'",
  "fastapi>=0.115.0 ; extra == 'dev'",
]
legacy-spikes = [
  "spike1_rss_to_duckdb",
  "spike2_asr_timestamps",
  "spike3_chunking_and_metadata",
  "spike4_embeddings",
  "spike5_qdrant",
  "spike6_retrieval",
  "spike7_hybrid",
  "spike8_rag_contract",
  "spike10_eval_automation",
  "spike11_agent",
]

[tool.uv.workspace]
members = ["spikes/*"]

[tool.uv.sources]
spike1_rss_to_duckdb = { workspace = true }
spike2_asr_timestamps = { workspace = true }
spike3_chunking_and_metadata = { workspace = true }
spike4_embeddings = { workspace = true }
spike5_qdrant = { workspace = true }
spike6_retrieval = { workspace = true }
spike7_hybrid = { workspace = true }
spike8_rag_contract = { workspace = true }
spike10_eval_automation = { workspace = true }
spike11_agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "httpx>=0.28.1",
    "ipykernel>=6.30.1",
    "isort>=6.0.1",
    "python-dotenv>=1.1.1",
    "ruff>=0.12.9",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "build",
  "dist",
]
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "W",    # basic linting & style
  "UP",                       # upgrade Python syntax
  "N",                        # pep8-naming
  "SIM",                      # simplify
  "C4",                       # comprehensions
  "TID",                      # tidy imports
]
ignore = [
  "E501",  # line length (handled by Black)
  "W292",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["modern_wisdom_rag_pipeline"]
skip = [".venv", "build", "dist"]

[project.scripts]
mw-rag = "modern_wisdom_rag_pipeline.cli:main"
