[project]
name = "spike1_rss_to_duckdb"
version = "0.1.0"
description = "A spike to ingest RSS feeds into DuckDB"
requires-python = ">=3.14"

dependencies = [
  "dlt>=1.16,<2.0",
  "duckdb>=1.3.2",
  "feedparser>=6.0.12",
  "python-dateutil>=2.9.0.post0",
]

[project.scripts]
run-spike1 = "spike1_rss_to_duckdb.main:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

