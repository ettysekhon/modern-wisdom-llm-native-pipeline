[project]
name = "spike3_chunking_and_metadata"
version = "0.1.0"
description = "Chunking and metadata spike"
requires-python = ">=3.13"
dependencies = [
    "blingfire>=0.1.8",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "pyarrow>=21.0.0",
    "pydantic>=2.11.9",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.1",
    "rich>=14.1.0",
    "tiktoken>=0.11.0",
]

[project.scripts]
run-spike3 = "spike3_chunking_and_metadata.main:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
